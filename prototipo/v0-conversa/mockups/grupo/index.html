<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finde, grupo primeiro</title>

<style>
:root{
  --papel:#fff3df; --folha:#fff9ed; --tinta:#203f77; --soft:#4b5f8d;
  --acao:#c77222; --acao-fill:#b55e18; --sombra:rgba(112,90,59,.15);
  --hand:"Patrick Hand","Chalkboard SE","Comic Neue",cursive;
  --sans:-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
.avaliar{border-bottom:1.5px dashed var(--soft);padding:6px 16px;font-size:12px;color:var(--soft);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.avaliar select{background:var(--folha);border:1.5px solid var(--soft);border-radius:10px;min-height:44px;padding:0 10px;font-size:13px;max-width:70vw}
.col{max-width:480px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 6px}
.logo{font-family:var(--hand);font-size:30px;line-height:1;letter-spacing:.5px}
.passo{font-size:12px;color:var(--soft)}
h1,h2,h3,.hand{font-family:var(--hand);font-weight:400}
h1{font-size:36px;line-height:1.08;margin:10px 0 8px}
h2{font-size:26px;line-height:1.15;margin:0 0 6px}
h3{font-size:25px;line-height:1.15;margin:0}
p{margin:0 0 12px}
.lead{font-size:17px;max-width:38ch}
.eyebrow{font-size:12.5px;color:var(--soft);margin:18px 0 0;letter-spacing:.2px}
.soft{color:var(--soft)}
.small{font-size:13.5px}
.pg{animation:assenta .22s ease-out both}
@keyframes assenta{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.folha{background:var(--folha);border:2px solid var(--tinta);border-radius:var(--r);box-shadow:0 4px 0 var(--sombra);padding:16px}
.rot-a{transform:rotate(-.5deg)}.rot-b{transform:rotate(.6deg)}.rot-c{transform:rotate(-.3deg)}
fieldset{border:0;padding:0;margin:22px 0 0;min-width:0}
legend{font-family:var(--hand);font-size:23px;padding:0;margin-bottom:8px;line-height:1.1}
.hint{font-size:13.5px;color:var(--soft);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.g2{display:grid;grid-template-columns:1fr 1fr}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:8px 14px;border:2px solid var(--tinta);border-radius:14px;background:var(--folha);box-shadow:0 3px 0 var(--sombra);font-size:15px;transition:transform .15s,background .15s}
.chip input:checked+span{background:var(--tinta);color:var(--folha)}
.chip input:focus-visible+span{outline:3px solid var(--tinta);outline-offset:3px}
.chip input:active+span{transform:translateY(2px)}
.chips.big .chip span{min-height:56px;font-family:var(--hand);font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:2px solid var(--tinta);border-radius:14px;background:var(--acao-fill);color:#fffdf6;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--tinta);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--folha);color:var(--tinta);box-shadow:0 3px 0 var(--sombra)}
.btn.sec:active{box-shadow:0 0 0 var(--sombra)}
.btn.min{min-height:44px;padding:8px 14px;font-size:14.5px}
.btn[aria-disabled="true"]{background:var(--papel);color:var(--soft);border-style:dashed;box-shadow:none;cursor:default}
.btn.on{background:var(--tinta);color:var(--folha);box-shadow:0 4px 0 var(--sombra)}
.link{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14.5px}
input[type=text]{width:100%;min-height:50px;border:2px solid var(--tinta);border-radius:14px;background:var(--folha);padding:8px 14px;font-size:18px;box-shadow:inset 0 2px 0 var(--sombra)}
label.f{display:block;font-family:var(--hand);font-size:23px;margin:0 0 8px}
.err{color:#8a2c0d;font-size:14px;margin:8px 0 0;min-height:20px}
.stack>*+*{margin-top:12px}
.linkbox{display:flex;align-items:center;gap:8px;border:2px dashed var(--tinta);border-radius:14px;padding:6px 6px 6px 14px;background:var(--folha);font-size:15px;word-break:break-all}
.linkbox span{flex:1}
.msg{white-space:pre-line;font-size:15px;border-left:3px solid var(--tinta);padding-left:12px;margin:0}
.mini{border:2px solid var(--tinta);border-radius:14px;background:var(--papel);padding:12px;font-size:14px;transform:rotate(.6deg)}
.mini b{font-family:var(--hand);font-weight:400;font-size:20px;display:block;margin-bottom:4px}
.ghostbar{display:flex;gap:6px;margin-top:8px}
.ghostbar i{display:block;height:20px;border:1.5px solid var(--tinta);border-radius:10px;flex:1;background:var(--folha)}
/* mesa */
.mesahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mesa{border:2px solid var(--tinta);border-radius:20px;padding:12px;background:var(--folha);box-shadow:0 4px 0 var(--sombra);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat{border:2px solid var(--tinta);border-radius:14px;background:var(--papel);padding:10px;min-height:96px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 var(--sombra)}
.seat.in{animation:senta .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes senta{from{opacity:0;transform:translateY(-18px) rotate(-6deg)}to{opacity:1}}
.seat:nth-child(odd){transform:rotate(-.8deg)}.seat:nth-child(even){transform:rotate(.7deg)}
.seat.vazia{border-style:dashed;background:transparent;box-shadow:none;color:var(--soft);justify-content:center;align-items:center;text-align:center;font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--tinta);background:var(--folha);font-family:var(--hand);font-size:19px;line-height:1;flex:none}
.av.me{background:var(--tinta);color:var(--folha)}
.av.s{width:26px;height:26px;font-size:15px;border-width:1.5px}
.nm{font-family:var(--hand);font-size:22px;line-height:1.05;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11.5px;border:1.5px solid var(--tinta);border-radius:8px;padding:1px 6px;background:var(--folha);line-height:1.5}
.voz{border:2px solid var(--tinta);border-radius:18px 18px 18px 4px;background:var(--folha);padding:12px 14px;box-shadow:0 4px 0 var(--sombra)}
.voz .now{font-family:var(--hand);font-size:23px;line-height:1.2;margin:0}
.voz .old{font-size:13px;color:var(--soft);margin:6px 0 0}
.voz .old p{margin:0 0 2px}
.quem{font-size:12px;color:var(--soft);margin:0 0 4px}
.funil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:0}
.funil b{font-family:var(--hand);font-weight:400;font-size:21px;margin-left:4px}
.funil .ar{color:var(--soft)}
.funil .pt{border:1.5px solid var(--tinta);border-radius:10px;padding:2px 9px;background:var(--folha)}
.mudou{border:2px dashed var(--tinta);border-radius:14px;padding:12px 14px;background:var(--papel);font-size:14.5px}
.mudou h3{font-size:21px;margin-bottom:4px}
.mudou ul{margin:4px 0 0;padding-left:18px}
.opt{border:2px solid var(--tinta);border-radius:18px;background:var(--folha);padding:16px;box-shadow:0 5px 0 var(--sombra);display:block}
.opt.in{animation:senta .4s ease-out both}
.opt:nth-child(1){transform:rotate(-.4deg)}.opt:nth-child(2){transform:rotate(.5deg)}.opt:nth-child(3){transform:rotate(-.25deg)}
.opt.leva{border-width:3px}
.sel{display:inline-block;font-size:12px;border:1.5px solid var(--tinta);border-radius:8px;padding:2px 8px;margin-bottom:8px;background:var(--papel)}
.sel.casa{background:var(--tinta);color:var(--folha)}
.sel.pat{border-style:dashed}
.meta{font-size:13.5px;color:var(--soft);margin:4px 0 8px}
.cur{font-family:var(--hand);font-size:19px;line-height:1.25;margin:0 0 10px}
.pq{list-style:none;margin:0 0 10px;padding:0;border-top:1.5px dashed var(--soft);padding-top:8px}
.pq li{position:relative;padding-left:20px;margin:0 0 5px;font-size:15px}
.pq li:before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border:2px solid var(--tinta);border-radius:2px;transform:rotate(45deg)}
.depois{font-size:13.5px;margin:0 0 12px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.votantes{display:flex;gap:4px;min-height:26px}
.regra{font-size:13.5px;color:var(--soft)}
.placeholder{border:2px dashed var(--tinta);border-radius:16px;padding:14px;color:var(--soft);font-size:14px}
.grande{font-family:var(--hand);font-size:56px;line-height:1;margin:0}
/* bilhete */
.bilhete{position:relative;border:2px solid var(--tinta);border-radius:18px;background:var(--folha);box-shadow:0 5px 0 var(--sombra);overflow:hidden;transform:rotate(-.6deg)}
.bilhete .alto{padding:20px 18px 18px}
.bilhete .baixo{padding:16px 18px 20px;border-top:2.5px dashed var(--tinta);position:relative}
.bilhete .baixo:before,.bilhete .baixo:after{content:"";position:absolute;top:-14px;width:24px;height:24px;border-radius:50%;background:var(--papel);border:2px solid var(--tinta)}
.bilhete .baixo:before{left:-14px}.bilhete .baixo:after{right:-14px}
.bilhete .big{font-family:var(--hand);font-size:34px;line-height:1.05;margin:2px 0 4px}
.lista-vai{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.vai{display:flex;align-items:center;gap:6px;font-family:var(--hand);font-size:21px}
.outro{opacity:.9}
.selo-fecha{display:inline-block;transform:rotate(-3deg);border:2px solid var(--tinta);border-radius:8px;padding:0 10px;font-family:var(--hand);font-size:20px;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.seat,.opt,.rot-a,.rot-b,.rot-c,.mini,.bilhete{transform:none!important}}
</style>
</head>

/* ---------- motor ---------- */
function falhas(e,people){
  const out=[];
  for(const p of people){
    if(e.preco>p.teto) out.push({p,kind:'teto'});
    if(p.regiao!=='qualquer' && Math.abs(RIDX[p.regiao]-RIDX[e.regiao])>1) out.push({p,kind:'regiao'});
    for(const n of p.naos){
      if(n==='comida'&&e.comida==='centro') out.push({p,kind:'comida'});
      if(n==='balada'&&BALADA.has(e.id)) out.push({p,kind:'balada'});
      if(n==='fila'&&FILA.has(e.id)) out.push({p,kind:'fila'});
    }
  }
  return out;
}
function base(e,people){
  return e.momentos.some(m=>MOM[S.quando].includes(m)) && e.grupo.max>=Math.max(people.length,3);
}
function elegiveis(people,skip){
  return EXP.filter(e=>base(e,people)).filter(e=>falhas(e,people).filter(f=>!(skip&&skip.pid===f.p.id&&skip.kind===f.kind)).length===0);
}
function score(e,people){
  let s=e.selo==='editorial'?.3:0;
  for(const p of people){ if(e.climas.includes(p.clima)) s+=2; if(p.regiao===e.regiao) s+=1; }
  return s;
}
function razoes(e,people){
  const per={}; people.forEach(p=>per[p.id]=[]);
  const baixo=people.reduce((a,p)=>p.teto<a.teto?p:a,people[0]);
  if(baixo.teto<3) per[baixo.id].push(e.preco===0?`não pesa no bolso ${baixo.de}`:`cabe no teto ${baixo.de}`);
  people.forEach(p=>{
    if(p.regiao!=='qualquer'){ const d=Math.abs(RIDX[p.regiao]-RIDX[e.regiao]); per[p.id].push(d===0?`é no bairro ${p.de}`:`fica a uma corrida curta ${p.de}`); }
    if(e.climas.includes(p.clima)) per[p.id].push(`${p.art} pediu ${CLIMA[p.clima]}`);
    p.naos.forEach(n=>{
      if(n==='balada') per[p.id].push(`sem balada, como ${p.art} pediu`);
      if(n==='fila') per[p.id].push(`sem cara de fila, como ${p.art} pediu`);
      if(n==='comida') per[p.id].push(`não gira em torno de comida, como ${p.art} pediu`);
    });
  });
  const r=[]; const max=Math.max(...people.map(p=>per[p.id].length));
  for(let k=0;k<max&&r.length<5;k++) people.forEach(p=>{ if(per[p.id][k]&&r.length<5) r.push(per[p.id][k]); });
  return r.length?r:['cabe em todo mundo da mesa'];
}
function escolher(people){
  const el=elegiveis(people);
  const ed=el.filter(e=>e.selo==='editorial').map(e=>({e,s:score(e,people)})).sort((a,b)=>b.s-a.s||a.e.id.localeCompare(b.e.id));
  const picks=[];
  for(const c of ed){ if(picks.length<3 && !picks.some(p=>p.e.tipo===c.e.tipo)) picks.push(c); }
  for(const c of ed){ if(picks.length<3 && !picks.includes(c)) picks.push(c); }
  const sp=el.filter(e=>e.selo==='patrocinado').map(e=>({e,s:score(e,people)}))[0];
  if(sp && picks.length===3 && sp.s>=picks[2].s-1) picks[2]=sp;
  else if(sp && picks.length<3) picks.push(sp);
  return {opts:picks.map((p,i)=>({e:p.e,casa:i===0&&p.e.selo!=='patrocinado',reasons:razoes(p.e,people)})),count:el.length};
}
function porque(f){
  const p=f.p;
  return {teto:`passa do teto ${p.de}`,regiao:`fica longe ${p.de}`,balada:`é de balada e ${p.art} pediu sem`,fila:`pode ter fila e ${p.art} pediu sem`,comida:`é comida como programa e ${p.art} pediu sem`}[f.kind];
}
function marcas(p){
  const t=[TETO[p.teto],p.regiao==='qualquer'?'qualquer lugar':REGCURTA[p.regiao],CLIMAV[p.clima].toLowerCase()];
  p.naos.forEach(n=>t.push(NAOS[n]));
  return t;
}
function frase(p){
  const n=p.naos.length?`, ${p.naos.map(x=>NAOS[x]).join(' e ')}`:'';
  return `${TETO[p.teto]}, ${p.regiao==='qualquer'?'topa qualquer região':'sai de '+REGCURTA[p.regiao]}, quer ${CLIMA[p.clima]}${n}`;
}

      const reg=newcomer&&newcomer.regiao!=='qualquer'&&newcomer.regiao!==e.regiao&&r.opts.some(o=>o.e.regiao===newcomer.regiao);

function logar(t){S.log.unshift(t); if(S.log.length>6)S.log.pop();}
function entrar(id){
  if(S.entrou.has(id))return; S.entrou.add(id);
  const p={...FR[id],naos:[...FR[id].naos]};
  S.people.push(p);
  logar(`${p.name} entrou: ${frase(p)}.`);
  update(`${p.art[0].toUpperCase()+p.art.slice(1)} entrou na mesa.`,p);
}
function votar(pid,oid){ if(S.closed)return; if(S.votes[pid]===oid) delete S.votes[pid]; else S.votes[pid]=oid; if(pid==='me'&&S.votes.me&&!S.userVotedAt) S.userVotedAt=Date.now(); }
function placar(){
  const c={}; Object.values(S.votes).forEach(o=>c[o]=(c[o]||0)+1);
  const ordem=S.opts.map(o=>o.e.id);
  let lider=null,max=0;
  ordem.forEach(id=>{ if((c[id]||0)>max){max=c[id];lider=id;} });
  const total=Object.keys(S.votes).length;
  const maioria=max>S.people.length/2;
  const todos=total===S.people.length&&S.people.length>=3;
  return {c,lider,max,total,maioria,todos};
}
function melhorPara(p){
  let best=null,bs=-1;
  S.opts.forEach(o=>{let s=(o.e.climas.includes(p.clima)?2:0)+(o.e.regiao===p.regiao?1:0)+(o.casa?.1:0); if(s>bs){bs=s;best=o.e.id;}});
  return best;
}
function tick(){
  if(!S.running||S.closed)return;
  const t=Date.now()-S.t0; let mudou=false;
  for(const en of ENTRADAS){ if(t>=en.at&&!S.entrou.has(en.id)){ entrar(en.id); mudou=true; break; } }
  if(S.userVotedAt&&S.opts.length&&S.votes.me){
    for(const id of ['bia','leo','ju']){
      if(S.entrou.has(id)&&!S.votes[id]&&Date.now()-S.userVotedAt>=ATRASO_VOTO[id]){
        const p=S.people.find(x=>x.id===id);
        const alvo=id==='leo'?melhorPara(p):S.votes.me;
        if(S.opts.some(o=>o.e.id===alvo)){ S.votes[id]=alvo; logar(`${p.name} votou em ${NOMES[alvo]}.`); mudou=true; break; }
      }
    }
  }
  if(mudou&&S.screen==='mesa') pintaMesa();
}
setInterval(tick,600);

function semear(nome){
  const q=S.quando, pz=S.prazo;
  S=novo(); S.quando=q; S.prazo=pz;
  S.me=meDefault();
  const add=id=>{S.entrou.add(id);S.people.push({...FR[id],naos:[...FR[id].naos]});};
  if(nome==='criar'){S.screen='criar';S.me=null;return;}
  if(nome==='link'){S.screen='link';S.me=null;return;}
  if(nome==='form'){S.screen='form';return;}
  S.people=[S.me];S.screen='mesa';
  update('Você abriu a mesa.',S.me);logar(`${S.me.name} abriu a mesa: ${frase(S.me)}.`);
  if(nome==='solo'){return;}
  if(nome==='dois'){add('bia');logar(`Bia entrou: ${frase(FR.bia)}.`);update('Bia entrou na mesa.',FR.bia);return;}
  if(nome==='conflito'){
    S.me={...S.me,teto:1,regiao:'centro',clima:'conversar',naos:['fila']};S.people=[S.me];
    S.hist=[];S.opts=[];update('Você abriu a mesa.',S.me);
    S.people.push({...FR.bia,teto:0,clima:'relaxar',naos:['comida']});S.entrou.add('bia');
    S.people.push({...FR.ju,teto:1});S.entrou.add('ju');
    update('Com a Ju deu três.',FR.ju);
    S.people.push({...FR.leo});S.entrou.add('leo');S.log=[];
    logar('Léo entrou: até R$ 120, sai de Paulista, quer agito, sem fila.');
    update('O Léo entrou na mesa.',FR.leo);
    return;
  }
  add('bia');add('ju');
  update('Com a Ju deu três.',FR.ju);
  add('leo');S.log=[];
  logar(`Léo entrou: ${frase(FR.leo)}.`);
  update('O Léo entrou na mesa.',FR.leo);
  if(nome==='opcoes'){S.running=false;return;}
  if(nome==='bilhete'){
    const o=S.opts[0].e.id;
    S.votes={me:o,bia:o,ju:o,leo:S.opts[1]?S.opts[1].e.id:o};
    S.closed=true;S.vencedor=o;S.screen='bilhete';
  }
}

function conflito(){
  const el=S.count; const people=S.people;
  const ganhos=[];
  people.forEach(p=>{
    const kinds=[]; if(p.teto<3)kinds.push('teto'); if(p.regiao!=='qualquer')kinds.push('regiao'); p.naos.forEach(n=>kinds.push(n));
    kinds.forEach(k=>{const g=elegiveis(people,{pid:p.id,kind:k}).length-el; if(g>0)ganhos.push({p,k,g});});
  });
  ganhos.sort((a,b)=>b.g-a.g);
  const top=[]; ganhos.forEach(x=>{ if(top.length<2&&!top.some(y=>y.p===x.p&&y.k===x.k)) top.push(x); });
  const pesos=falhas_resumo(people);
  const txt=(x)=>({teto:`aceitar ${TETO[Math.min(3,x.p.teto+1)]}`,regiao:'aceitar qualquer região',comida:'abrir mão do “sem comida”',balada:'abrir mão do “sem balada”',fila:'abrir mão do “sem fila”'}[x.k]);
  return `<div class="folha rot-b"><h2>${el===0?'Nada cabe em todo mundo':'Só '+el+' cabe em todo mundo'}</h2>
  <p class="small">As marcas da mesa se atropelam. ${esc(pesos)}</p>
  ${top.length?`<p class="small" style="margin-bottom:8px">Eu não escolho quem cede. Dá para perguntar a quem tem a marca que mais pesa:</p><div class="stack">
  ${top.map(x=>`<div><button class="btn sec block" data-act="ceder" data-pid="${x.p.id}" data-k="${x.k}">${x.p.id==='me'?'Ceder o meu: ':'Perguntar '+(x.p.art==='a Ju'||x.p.art==='a Bia'?'à ':'ao ')+x.p.name+': '}${esc(txt(x))}</button><p class="hint" style="margin:4px 0 0">Voltam ${x.g} lugar${x.g>1?'es':''} para a lista.</p></div>`).join('')}</div>`:''}
  </div>`;
}
function falhas_resumo(people){
  const b=EXP.filter(e=>base(e,people)); const c={};
  b.forEach(e=>falhas(e,people).forEach(f=>{const k=f.p.name+'|'+f.kind;c[k]=(c[k]||0)+1;}));
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>{const [n,kind]=k.split('|');const L={teto:'o teto',regiao:'a região',comida:'o “sem comida”',balada:'o “sem balada”',fila:'o “sem fila”'}[kind];return `${L} de ${n} tira ${v}`;});
  return arr.length?'O que mais pesa: '+arr.join('; ')+'.':'';
}
function vBilhete(){
  const e=EXP.find(x=>x.id===S.vencedor)||S.opts[0].e;
  const vai=S.people.filter(p=>S.votes[p.id]===e.id), fora=S.people.filter(p=>S.votes[p.id]!==e.id);
  const dep=e.combina.map(c=>NOMES[c]).filter(Boolean)[0];
  const av=(p,c)=>`<span class="vai ${c||''}"><span class="av${p.id==='me'?' me':''}" aria-hidden="true">${esc(p.name[0].toUpperCase())}</span>${esc(p.name)}</span>`;
  return `<section class="pg" style="margin-top:6px">
  <p class="eyebrow">Programa fechado pela maioria da mesa</p>
  <h1 style="margin-bottom:16px">Está combinado.</h1>
  <div class="bilhete"><div class="alto"><span class="selo-fecha">fechado</span>
   <p class="small soft" style="margin:0">${esc(cap(QUANDO[S.quando]))}</p>
   <p class="big">${esc(e.nome)}</p>
   <p class="meta" style="margin:0 0 8px">${esc(e.bairro)} · ${TIPO[e.tipo]} · ${FAIXA[e.preco]} (faixa estimada)</p>
   ${dep?`<p class="small" style="margin:0"><span class="soft">Depois:</span> ${esc(dep)}</p>`:''}</div>
   <div class="baixo"><p class="small soft" style="margin:0">Quem vai</p>
   <div class="lista-vai">${vai.map(p=>av(p)).join('')}</div>
   ${fora.length?`<p class="small soft" style="margin:8px 0 4px">Votou em outra. Entra se quiser; a conta cabe nesta também</p><div class="lista-vai">${fora.map(p=>av(p,'outro')).join('')}</div>`:''}
   <p class="small soft" style="margin:10px 0 0">Horário e valor: confirmem no lugar antes de sair. O Finde não garante nenhum dos dois.</p></div></div>
  <div class="stack" style="margin-top:22px">
   <a class="btn block" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`Fechou: ${QUANDO[S.quando]}, ${e.nome} (${e.bairro}). Vão: ${vai.map(p=>p.name).join(', ')}. Horário e valor, vale conferir lá.`)}">Mandar o bilhete no grupo</a>
   <button class="btn sec block" data-act="copiar" data-what="bilhete">${S.copiado==='bilhete'?'Copiado':'Copiar o bilhete'}</button>
   <button class="link" data-act="reabrir">Reabrir a votação</button></div>
  </section>`;
}

/* ---------- eventos ---------- */
function copiar(t,what){
  const ok=()=>{S.copiado=what;setTimeout(()=>{S.copiado='';},2200);};
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>{});} }catch(_){}
  ok();
}
function feedbackCopy(btn,what,def){btn.textContent='Copiado';setTimeout(()=>{ if(btn.isConnected) btn.textContent=def; },2200);}
view.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='gerar'){ S.quando=(view.querySelector('input[name=quando]:checked')||{}).value||S.quando; S.prazo=(view.querySelector('input[name=prazo]:checked')||{}).value||S.prazo; go('link'); }
  else if(a==='copiar'){
    const w=b.dataset.what; const def=b.textContent;
    const txt=w==='lembrete'?`Falta só marcar o seu aqui: https://${LINK}`:w==='bilhete'?`Fechou: ${QUANDO[S.quando]}, ${(EXP.find(x=>x.id===S.vencedor)||{}).nome}`:`https://${LINK}`;
    try{navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});}catch(_){}
    feedbackCopy(b,w,def);
  }
  else if(a==='paraform'){ go('form'); }
  else if(a==='editar'){ S.editing=true; go('form'); }
  else if(a==='votar'){ votar('me',b.dataset.opt); pintaMesa(); }
  else if(a==='fechar'){ S.closed=true; S.vencedor=b.dataset.opt; go('bilhete'); syncSel(); }
  else if(a==='reabrir'){ S.closed=false; S.vencedor=null; S.running=true; go('mesa'); syncSel(); }
  else if(a==='ceder'){
    const p=S.people.find(x=>x.id===b.dataset.pid), k=b.dataset.k;
    const aplicar=()=>{
      let t='';
      if(k==='teto'){p.teto=Math.min(3,p.teto+1);t=`aceita ${TETO[p.teto]}`;}
      else if(k==='regiao'){p.regiao='qualquer';t='aceita qualquer região';}
      else {p.naos=p.naos.filter(x=>x!==k);t=`abriu mão do “${NAOS[k]}”`;}
      if(p.id==='me'){ logar(`${p.name} cedeu: ${t}.`); update(`${p.name} cedeu: ${t}.`); }
      else { logar(`${p.name} topou: ${t}.`); update(`${p.name} topou: ${t}.`); }
      pintaMesa();
    };
    if(p.id==='me') aplicar();
    else { b.textContent='Perguntando…'; b.setAttribute('aria-disabled','true'); setTimeout(aplicar,1400); }
  }
});
view.addEventListener('submit',ev=>{
  if(ev.target.id!=='f')return; ev.preventDefault();
  const nome=$('#nome').value.trim(); const err=$('#err');
  if(!nome){err.textContent='Falta o seu nome. É assim que o grupo vai te ver na mesa.';$('#nome').focus();return;}
  const f=new FormData(ev.target);
  const m=S.me||meDefault();
  m.name=nome; m.teto=+f.get('teto'); m.regiao=f.get('regiao'); m.clima=f.get('clima'); m.naos=f.getAll('naos'); nomeMe(m);
  S.me=m;
  if(S.editing){
    S.editing=false; if(!S.people.includes(m))S.people[0]=m;
    logar(`${m.name} mudou a conta: ${frase(m)}.`);
    update(`${m.name} mudou a conta.`);
  } else {
    S.people=[m]; S.t0=Date.now(); S.running=true; S.hist=[]; S.opts=[]; S.entrou=new Set(); S.votes={};
    logar(`${m.name} abriu a mesa: ${frase(m)}.`);
    update('Você abriu a mesa.',m);
  }
  go('mesa'); syncSel();
});
const sel=$('#pular');
function syncSel(){
  const v=S.screen==='mesa'?(S.people.length<2?'solo':S.people.length<3?'dois':'opcoes'):S.screen==='bilhete'?'bilhete':S.screen;
  sel.value=v;
}
sel.addEventListener('change',()=>{
  const v=sel.value; semear(v);
  S.userVotedAt=0;
  if(v!=='criar'&&v!=='link'&&v!=='form'&&v!=='bilhete'){
    S.running=true;
    S.t0=Date.now()-(v==='dois'?8000:v==='solo'?0:99999);
  }
  go(S.screen);
});
go('criar');
</script>
</body>
</html>
