<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel · finde.</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#EADCD2">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fontes/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fontes/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="topo-dentro">
      <p class="marca">finde<span class="ponto">.</span></p>
      <p class="topo-titulo">Números do protótipo</p>
      <p class="vivo" id="vivo" hidden><span class="pulso" aria-hidden="true"></span><span id="vivo-texto">ao vivo</span></p>
      <div class="acoes" id="acoes" hidden>
        <button class="acao" id="copiar" type="button">Copiar imagem</button>
        <button class="acao" id="baixar" type="button">Baixar JPG</button>
        <button class="acao acao--sair" id="sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <form class="entrada" id="entrada" autocomplete="off">
      <h1>Números do protótipo</h1>
      <label class="rotulo" for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label class="lembrar"><input id="lembrar" type="checkbox"> Lembrar neste aparelho</label>
      <p class="erro" id="erro" role="alert"></p>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <div class="painel" id="painel" hidden aria-live="off"></div>
    <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
