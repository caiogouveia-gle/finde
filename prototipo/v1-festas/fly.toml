# Fly.io: a landing do Finde, em endereço provisório (finde.fly.dev).
# O protótipo (o app) é outro app do Fly, finde-app.fly.dev: ver fly.app.toml.
# Publicar a landing: fly deploy (nesta pasta). Volume criado uma vez:
#   fly volumes create finde_convites --region gru --size 1
app = "finde"
primary_region = "gru"

[build]
  # ./Dockerfile, a mesma imagem do app; FINDE_SITE decide o que sobe.

# Só a landing. /app e os convites antigos (/p/<id>) vão para o app.
[env]
  FINDE_SITE = "landing"
  FINDE_URL_APP = "https://finde-app.fly.dev/"

[http_service]
  internal_port = 8080
  force_https = true
  # Para quando ninguém usa e liga no primeiro acesso: o protótipo não tem
  # tarefa agendada, então máquina parada não perde nada.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"
    method = "get"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# A máquina já nasceu com este volume e continua com ele. Os convites agora
# moram no volume do finde-app; a landing não lê nem grava aqui.
[mounts]
  source = "finde_convites"
  destination = "/data"
